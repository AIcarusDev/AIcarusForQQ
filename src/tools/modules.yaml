modules:
  core:
    path: core
    always_active: true
    namespaces:
      - core

  goals:
    path: goals
    always_active: true
    namespaces:
      - goals

  browser:
    path: browser
    active_when: browser_available
    namespaces:
      - browser_use
      - browser_runtime
    mounts: []

  workspace:
    path: workspace
    active_when: workspace_enabled
    namespaces:
      - computer

