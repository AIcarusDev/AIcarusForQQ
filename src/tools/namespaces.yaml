namespaces:
  core:
    description: ""
    permanent: true
    closeable: false
    path: core
    ttl_rounds: null
    tools:
      - namespace_manage
      - calculator
      - list_platforms
      - enter_platform
      - close_platform
      - runtime_manage
      - think_deeply
      - recall_memory
      - recall_skill_resource
      - goal_manage
      - restart
      - view_image_by_ref
      - examine_image
      - web_search
      - web_extract
      - get_weather

  browser_use:
    description: "完整的谷歌浏览器使用和浏览器精确 DOM 定位。"
    path: browser/browser_use
    ttl_rounds: null
    tools:
      - browser_control
      - browser_locator
    lifecycle:
      keep_open_while: "browser_world_active"
      close_on:
        - tool: browser_control
          action: close_browser
          ok: true

  browser_runtime:
    visible: false
    openable: false
    discoverable: false
    path: browser/browser_runtime
    tools: []

