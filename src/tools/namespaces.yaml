namespaces:
  core:
    description: ""
    permanent: true
    closeable: false
    path: core
    ttl_rounds: null
    tools:
      - namespace_manage
      - calculator
      - list_platforms
      - enter_platform
      - close_platform
      - runtime_manage
      - think_deeply
      - recall_memory
      - recall_skill_resource
      - goal_manage
      - restart
      - view_image
      - save_image
      - examine_image
      - web_search
      - web_extract
      - get_weather

  browser_use:
    description: "完整的谷歌浏览器使用和浏览器精确 DOM 定位。"
    path: browser/browser_use
    ttl_rounds: null
    tools:
      - browser_control
      - browser_locator
    lifecycle:
      keep_open_while: "browser_world_active"
      close_on:
        - tool: browser_control
          action: close_browser
          ok: true

  browser_runtime:
    visible: false
    openable: false
    discoverable: false
    path: browser/browser_runtime
    tools: []

  project_source:
    description: "浏览、搜索和读取自身当前运行框架的静态源码。"
    path: project_source
    skill: project-source
    ttl_rounds: null
    tools:
      - list
      - read
      - search

  computer:
    description: "运行 Linux 命令，创建、读取、编辑、查找和搜索文件，并向浏览器提供电脑内的 localhost 服务。"
    visible: true
    discoverable: true
    openable: true
    permanent: false
    closeable: true
    ttl_rounds: null
    path: workspace
    import_path: workspace.tools
    skill: computer
    tools:
      - command
      - read_file
      - edit_file
      - write_file
      - find_files
      - search

