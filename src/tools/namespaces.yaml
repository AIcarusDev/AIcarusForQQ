namespaces:
  core:
    description: ""
    permanent: true
    closeable: false
    path: core
    ttl_rounds: null
    tools:
      - namespace_manage
      - calculator
      - wait
      - sleep
      - shift
      - think_deeply
      - recall_memory
      - recall_skill_resource
      - goal_manage
      - restart
      - view_image_by_ref
      - examine_image
      - web_search
      - web_extract
      - get_weather

  qq_social:
    description: "QQ 社交动作：发送文字/表情包/图片/语音消息、撤回消息、发起戳一戳、复读。"
    path: qq/qq_social
    skill: qq-social-style
    ttl_rounds: null
    tools:
      - send_message
      - send_voice
      - recall_message
      - poke
      - plus_one
    attach:
      - namespace: qq_stickers
        tool: list_stickers
        reason: "`send_message` may need sticker_id。"

  qq_stickers:
    description: "QQ 表情包收藏管理。查看表情包合集、将觉得能用到的动画表情/图片/gif存为表情包、编辑表情包印象、删除不需要的表情包。"
    path: qq/qq_stickers
    ttl_rounds: null
    tools:
      - list_stickers
      - save_sticker
      - update_sticker
      - delete_sticker

  qq_chat_view:
    description: "QQ 聊天窗口浏览。滑动聊天记录查看早前消息、浏览合并转发消息、搜索会话的历史记录。"
    path: qq/qq_chat_view
    ttl_rounds: null
    tools:
      - scroll_chat_log
      - browse_forward
      - search_history

  qq_profile:
    description: "QQ 资料读取和维护。查看任何用户（包括自己）的基础资料、头像/QQ签名，设置自己的 QQ 签名。"
    path: qq/qq_profile
    ttl_rounds: null
    tools:
      - get_user_info
      - get_qq_signature
      - set_qq_signature
      - get_avatar

  qq_contacts:
    description: "QQ 联系人。查看会话列表、搜索列表中存在的会话。"
    path: qq/qq_contacts
    ttl_rounds: null
    tools:
      - list_contact
      - search_session

  qq_group_info:
    description: "QQ群信息。列出群成员名单、查看群公告、设置自己的群名称。在群聊中可用"
    path: qq/qq_group_info
    ttl_rounds: null
    tools:
      - get_group_members
      - get_group_notice
      - set_group_card

  browser_use:
    description: "完整的谷歌浏览器使用和浏览器精确 DOM 定位。"
    path: browser/browser_use
    ttl_rounds: null
    tools:
      - browser_control
      - browser_locator
    lifecycle:
      keep_open_while: "browser_world_active"
      close_on:
        - tool: browser_control
          action: close_browser
          ok: true

  qq_runtime:
    visible: false
    openable: false
    discoverable: false
    path: qq/qq_runtime
    tools:
      - wait_qq_event

  browser_runtime:
    visible: false
    openable: false
    discoverable: false
    path: browser/browser_runtime
    tools:
      - wait_browser_event
