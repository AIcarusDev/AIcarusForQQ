namespaces:
  core:
    description: ""
    permanent: true
    closeable: false
    path: core
    ttl_rounds: null
    tools:
      - namespace_manage
      - calculator
      - list_platforms
      - enter_platform
      - close_platform
      - runtime_manage
      - think_deeply
      - recall_memory
      - recall_skill_resource
      - goal_manage
      - restart
      - view_image_by_ref
      - examine_image
      - web_search
      - web_extract
      - get_weather

  browser_use:
    description: "完整的谷歌浏览器使用和浏览器精确 DOM 定位。"
    path: browser/browser_use
    ttl_rounds: null
    tools:
      - browser_control
      - browser_locator
    lifecycle:
      keep_open_while: "browser_world_active"
      close_on:
        - tool: browser_control
          action: close_browser
          ok: true

  browser_runtime:
    visible: false
    openable: false
    discoverable: false
    path: browser/browser_runtime
    tools: []

  attachments:
    description: "在已启用的工作区中下载并只读查看附件。当对方要求读取 QQ 文件、图片、语音或视频时，打开本工具组：先用 download 下载消息里的 ref，再用 read 查看；也支持公开 URL，且不会执行附件。"
    visible: true
    discoverable: true
    openable: true
    permanent: false
    closeable: true
    ttl_rounds: null
    path: attachments
    import_path: attachments.tools
    tools:
      - download
      - read

  computer:
    description: "你的 Linux 电脑。默认用户 agent，主目录 /home/agent，可用 sudo 获得 root 权限；可运行命令、管理文件、编辑写入文件；浏览器与它共享逻辑 localhost。"
    visible: true
    discoverable: true
    openable: true
    permanent: false
    closeable: true
    ttl_rounds: null
    path: workspace
    import_path: workspace.tools
    tools:
      - command
      - read_file
      - edit_file
      - write_file
      - find_files
      - search

